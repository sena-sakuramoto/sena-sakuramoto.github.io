# APDW central gitleaks config
# Extends default gitleaks rules with our specific secret/PII patterns.
# Used by: pre-commit hook, GitHub Actions workflow, history audit.

[extend]
useDefault = true

# ─────────────────────────────────────────────────────────────────
# Custom secret rules — APDW specific
# ─────────────────────────────────────────────────────────────────

[[rules]]
id = "stripe-live-key"
description = "Stripe live secret/publishable/restricted key"
regex = '''(sk|pk|rk)_live_[0-9a-zA-Z]{24,}'''
tags = ["stripe", "key", "P0"]
[rules.allowlist]
regexTarget = "match"
regexes = [
    # NOTE: written as x{16,} (not literal x-run) so GitHub Push Protection
    # does not mistake this allowlist entry itself for a real Stripe key.
    '''sk_live_x{16,}''',
    '''sk_live_REPLACE_ME''',
    '''sk_live_PLACEHOLDER''',
]

[[rules]]
id = "stripe-test-key"
description = "Stripe test secret key (test, but still don't commit)"
regex = '''sk_test_[0-9a-zA-Z]{24,}'''
tags = ["stripe", "key"]

[[rules]]
id = "stripe-checkout-session-live"
description = "Stripe LIVE checkout session ID — leaking these enables session replay/hijack"
regex = '''cs_live_[0-9a-zA-Z]{50,}'''
tags = ["stripe", "session", "P0"]

[[rules]]
id = "stripe-customer-id"
description = "Stripe Customer ID — PII identifier when paired with names/emails"
regex = '''\bcus_[0-9a-zA-Z]{14,}\b'''
tags = ["stripe", "pii"]

[[rules]]
id = "google-gemini-api-key"
description = "Google API key (Gemini, Maps, Firebase Web key, etc.)"
regex = '''\bAIza[0-9A-Za-z_\-]{35}\b'''
tags = ["google", "key", "P0"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic Claude API key"
regex = '''sk-ant-[a-zA-Z0-9_\-]{40,}'''
tags = ["anthropic", "key", "P0"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API key"
regex = '''sk-(?:proj-)?[a-zA-Z0-9_\-]{40,}'''
tags = ["openai", "key", "P0"]
[rules.allowlist]
regexes = [
    '''sk-ant-''',  # handled by anthropic-api-key rule
]

[[rules]]
id = "discord-bot-token"
description = "Discord bot token"
regex = '''(?i)(?:discord[_\-]?(?:bot[_\-]?)?token|DISCORD_BOT_TOKEN)['\"\s:=]+([MN][A-Za-z\d]{23,28}\.[\w-]{6,7}\.[\w-]{27,38})'''
tags = ["discord", "key"]

[[rules]]
id = "discord-webhook"
description = "Discord webhook URL (can be abused to spam channels)"
regex = '''https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/webhooks/[0-9]+/[A-Za-z0-9_\-]+'''
tags = ["discord"]

[[rules]]
id = "line-channel-secret"
description = "LINE Messaging API channel secret/access token"
regex = '''(?i)(line[_\-]?(?:channel[_\-]?)?(?:secret|access[_\-]?token))['\"\s:=]+[a-zA-Z0-9+/=]{32,}'''
tags = ["line", "key"]

[[rules]]
id = "zoom-client-secret"
description = "Zoom OAuth/Server-to-Server client secret"
regex = '''(?i)zoom[_\-]?client[_\-]?secret['\"\s:=]+[a-zA-Z0-9_\-]{20,}'''
tags = ["zoom", "key"]

[[rules]]
id = "nextauth-secret-assignment"
description = "NEXTAUTH_SECRET literal value in code/env"
regex = '''(?i)NEXTAUTH_SECRET['"\s:=]+['"][a-zA-Z0-9+/=_\-]{20,}['"]'''
tags = ["nextauth", "key"]

[[rules]]
id = "neo4j-password"
description = "Neo4j password env"
regex = '''(?i)NEO4J_(?:PASSWORD|PASS|AUTH)['"\s:=]+['"][^'"\s]{8,}['"]'''
tags = ["neo4j"]

[[rules]]
id = "google-service-account-json"
description = "Google service account private key (PEM in JSON)"
regex = '''"private_key"\s*:\s*"-----BEGIN (?:RSA )?PRIVATE KEY-----'''
tags = ["google", "key", "P0"]

[[rules]]
id = "huggingface-token"
description = "HuggingFace user/access token"
regex = '''hf_[a-zA-Z0-9]{30,}'''
tags = ["huggingface", "key"]

# ─────────────────────────────────────────────────────────────────
# PII rules — protect customer data
# ─────────────────────────────────────────────────────────────────

[[rules]]
id = "csv-with-email-column-jp"
description = "CSV/TSV header containing メールアドレス + 名前/氏名 (Japanese PII export)"
regex = '''(?im)^.*メールアドレス.*(?:名前|氏名|お名前).*$'''
tags = ["pii", "P0"]
path = '''\.(?:csv|tsv|txt|md)$'''

[[rules]]
id = "csv-with-email-column-en"
description = "CSV header with email + name columns"
regex = '''(?im)^(?:.*,)?\s*(?:e?mail|email_address)\s*,(?:[^,\n]*,)*?\s*(?:name|full_name|first_name)\b'''
tags = ["pii"]
path = '''\.(?:csv|tsv)$'''

[[rules]]
id = "discord-links-file"
description = "discord_links.csv/.txt — known PII export pattern from past incident"
regex = '''.'''
tags = ["pii", "P0"]
path = '''(?i)discord[_\-]links?\.(?:csv|txt|tsv)$'''

[[rules]]
id = "customer-export-file"
description = "Customer/member export filename pattern"
regex = '''.'''
tags = ["pii"]
path = '''(?i)(?:customers?|members?|users?|kaiin|顧客|会員)[_\-].*\.(?:csv|tsv|xlsx?)$'''

# ─────────────────────────────────────────────────────────────────
# .env file protection
# ─────────────────────────────────────────────────────────────────

[[rules]]
id = "dotenv-file"
description = "Raw .env file with values (use .env.example with placeholders instead)"
regex = '''(?m)^\s*[A-Z][A-Z0-9_]{2,}\s*=\s*[^#\s].{4,}'''
tags = ["env", "P0"]
path = '''(?:^|/)\.env(?:\.local|\.production|\.development|\.staging)?$'''

# ─────────────────────────────────────────────────────────────────
# Generic high-entropy detection
# ─────────────────────────────────────────────────────────────────

[[rules]]
id = "private-key-pem"
description = "PEM-encoded private key block"
regex = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'''
tags = ["key", "P0"]

# ─────────────────────────────────────────────────────────────────
# Allowlist (false positives & known safe paths)
# ─────────────────────────────────────────────────────────────────

[[allowlists]]
description = "Global allowlist for known-safe paths and example placeholders"
paths = [
    '''(?i).*\.example$''',
    '''(?i).*\.sample$''',
    '''(?i).*\.template$''',
    '''(?i).*\.example\.[a-z]+$''',
    '''(?i)\.env\.example$''',
    '''(?i)\.env\.sample$''',
    '''(?i)setup_vars\.example\.sh$''',
    '''(?i)CHANGELOG.*\.md$''',
    '''(?i)package(?:-lock)?\.json$''',
    '''(?i)pnpm-lock\.yaml$''',
    '''(?i)yarn\.lock$''',
    '''(?i)Cargo\.lock$''',
    '''(?i)poetry\.lock$''',
    '''.*/node_modules/.*''',
    '''.*/\.next/.*''',
    '''.*/dist/.*''',
    '''.*/build/.*''',
    '''.*/_archive/.*''',
    '''.*/coverage/.*''',
    '''.*/__pycache__/.*''',
    '''.*\.min\.(?:js|css)$''',
]

regexes = [
    '''xxx+''',
    '''REPLACE_ME''',
    '''your[_\-]?(?:api[_\-]?)?key[_\-]?here''',
    '''YOUR_[A-Z_]+_HERE''',
    '''<[a-z_]+>''',
    '''placeholder''',
    '''example[_\-]?(?:token|secret|key)''',
]

stopwords = [
    "example",
    "sample",
    "test_value",
    "dummy",
]
